# 1. The ServiceAccount that the EventListener runs as
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tekton-trigger-sa
  namespace: tekton-pipelines
---
# 2. Comprehensive ClusterRole to stop the "Informer" crashes
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tekton-trigger-cluster-role
rules:
  # Allow creating the PipelineRuns
  - apiGroups: ["tekton.dev"]
    resources: ["pipelineruns", "pipelines"]
    verbs: ["create", "get", "list", "watch"]
  # Allow the Listener to see all Trigger components (Required for startup)
  - apiGroups: ["triggers.tekton.dev"]
    resources: ["eventlisteners", "triggerbindings", "triggertemplates", "interceptors", "clusterinterceptors", "clustertriggerbindings", "triggers"]
    verbs: ["get", "list", "watch"]
  # Allow reading secrets (often used for webhook validation)
  - apiGroups: [""]
    resources: ["configmaps", "secrets"]
    verbs: ["get", "list", "watch"]
---
# 3. Bind the ServiceAccount to the ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tekton-trigger-cluster-binding
subjects:
  - kind: ServiceAccount
    name: tekton-trigger-sa
    namespace: tekton-pipelines
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tekton-trigger-cluster-role
---
# 4. The Trigger Binding (Extracts data from Git JSON)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerBinding
metadata:
  name: git-binding
  namespace: tekton-pipelines
spec:
  params:
    - name: gitrepo
      value: $(body.repository.clone_url)
    - name: repo-name
      value: $(extensions.image_name)
    - name: image-tag
      value: $(extensions.dynamic_tag)
---
# 5. The Trigger Template (Creates the PipelineRun)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: git-template
  namespace: tekton-pipelines
spec:
  params:
    - name: gitrepo
    - name: dockerfile-path
    - name: build-context
    - name: repo-name
    - name: image-tag
  resourcetemplates:
    - apiVersion: tekton.dev/v1beta1
      kind: PipelineRun
      metadata:
        generateName: build-push-run-
        namespace: tekton-pipelines
      spec:
        serviceAccountName: tekton-trigger-sa
        pipelineRef:
          name: build-and-push-pipeline
        workspaces:
          - name: shared-data
            volumeClaimTemplate:
              spec:
                accessModes: [ReadWriteOnce]
                resources:
                  requests:
                    storage: 1Gi
        params:
          - name: repo-url
            value: $(tt.params.gitrepo)
          - name: dockerfile-path
            value: $(tt.params.dockerfile-path)
          - name: build-context
            value: $(tt.params.build-context)
          - name: image-reference
            value: "192.168.1.196:30500/$(tt.params.repo-name):$(tt.params.image-tag)"
            # this reference doesn't work, you need real DNS 
            # value: "zot-service.cluster-services.svc.cluster.local:5000/$(tt.params.repo-name):$(tt.params.image-tag)"
---
# 6. The EventListener (The entry point for your webhook)
apiVersion: triggers.tekton.dev/v1beta1
kind: EventListener
metadata:
  name: git-listener
  namespace: tekton-pipelines
spec:
  serviceAccountName: tekton-trigger-sa
  triggers:
    - name: orb-of-pondering-backend-trigger
      interceptors:
        - ref: {name: "cel"}
          params:
            - name: filter
              value: "body.repository.full_name == 'pvacey/orb-of-pondering' && body.ref == 'refs/heads/master'"
            - name: overlays
              value:
                - key: image_name
                  expression: "body.repository.full_name.split('/')[1] + '-backend'"
                - key: dynamic_tag
                  expression: "string(int(body.repository.pushed_at)) + '-' + body.head_commit.id.truncate(7)"
      bindings:
        - ref: git-binding
        - name: dockerfile-path
          value: "backend/Dockerfile"
        - name: build-context
          value: "backend/"
      template:
        ref: git-template

    - name: orb-of-pondering-frontend-trigger
      interceptors:
        - ref: {name: "cel"}
          params:
            - name: filter
              value: "body.repository.full_name == 'pvacey/orb-of-pondering' && body.ref == 'refs/heads/master'"
            - name: overlays
              value:
                - key: image_name
                  expression: "body.repository.full_name.split('/')[1] + '-frontend'"
                - key: dynamic_tag
                  expression: "string(int(body.repository.pushed_at)) + '-' + body.head_commit.id.truncate(7)"
      template:
        ref: git-template
