apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: opencode-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencode
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: opencode
  template:
    metadata:
      labels:
        app: opencode
    spec:
      containers:
      - name: opencode
        image: ghcr.io/anomalyco/opencode:1.17.13
        args: ["serve", "--port", "4096", "--hostname", "0.0.0.0"]
        ports:
        - containerPort: 4096
        env:
        - name: OPENCODE_SERVER_USERNAME
          value: "pvacey"
        - name: OPENCODE_SERVER_PASSWORD
          valueFrom:
            secretKeyRef:
              name: opencode-auth
              key: password
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: opencode-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: opencode-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: opencode
  ports:
    - protocol: TCP
      port: 4096
      targetPort: 4096
