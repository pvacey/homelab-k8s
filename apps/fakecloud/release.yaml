apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fakecloud-pvc
  namespace: fakecloud
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fakecloud
  namespace: fakecloud
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fakecloud-lambda-pods
  namespace: fakecloud
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fakecloud-lambda-pods
  namespace: fakecloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fakecloud-lambda-pods
subjects:
  - kind: ServiceAccount
    name: fakecloud
    namespace: fakecloud
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fakecloud
  namespace: fakecloud
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fakecloud
  template:
    metadata:
      labels:
        app: fakecloud
    spec:
      serviceAccountName: fakecloud
      containers:
      - name: fakecloud
        image: ghcr.io/faiscadev/fakecloud:latest
        ports:
        - containerPort: 4566
        env:
        - name: FAKECLOUD_STORAGE_MODE
          value: persistent
        - name: FAKECLOUD_DATA_PATH
          value: /var/lib/fakecloud
        - name: FAKECLOUD_LAMBDA_BACKEND
          value: k8s
        - name: FAKECLOUD_K8S_SELF_URL
          value: http://fakecloud.fakecloud.svc.cluster.local:4566
        - name: FAKECLOUD_K8S_NAMESPACE
          value: fakecloud
        volumeMounts:
        - name: data
          mountPath: /var/lib/fakecloud
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: fakecloud-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: fakecloud
  namespace: fakecloud
spec:
  type: ClusterIP
  selector:
    app: fakecloud
  ports:
    - protocol: TCP
      port: 4566
      targetPort: 4566
---
apiVersion: v1
kind: Service
metadata:
  name: fakecloud-nodeport
  namespace: fakecloud
spec:
  type: NodePort
  selector:
    app: fakecloud
  ports:
    - protocol: TCP
      port: 4566
      targetPort: 4566
      nodePort: 30505 # Endpoint at http://<NODE_IP>:30505
