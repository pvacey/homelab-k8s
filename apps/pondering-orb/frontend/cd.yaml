# 1. THE REGISTRY: Points Flux to your Zot instance
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: pondering-repo-frontend
  namespace: flux-system
spec:
  image: 192.168.1.196:30500/orb-of-pondering-frontend
  interval: 1m
  insecure: true # Required for HTTP-only registries
---
# 2. THE POLICY: Logic to pick the "latest" image
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: pondering-policy-frontend
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: pondering-repo
  policy:
    numerical:
      order: asc
  filterTags:
    pattern: '^(?P<timestamp>\d+)-[a-f0-9]+$'
    extract: '$timestamp'
---
# 3. THE AUTOMATION: Commits the change back to your Git repo
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: pondering-automation-frontend
  namespace: flux-system
spec:
  interval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system # Name of the GitRepository resource that holds your YAMLs
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: "update ponderig-orb-frontend"
    push:
      branch: main
  update:
    path: ./apps/pondering-orb/frontend
    strategy: Setters
