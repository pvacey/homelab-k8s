apiVersion: apps/v1
kind: Deployment
metadata:
  name: annoying-noises
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: annoying-noises
  template:
    metadata:
      labels:
        app: annoying-noises
    spec:
      containers:
      - name: annoying-noises
        image: 192.168.1.196:30500/annoying-noises:latest # {"$imagepolicy": "flux-system:annoying-noises-policy"}
---
apiVersion: v1
kind: Service
metadata:
  name: annoying-noises-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: annoying-noises
  ports:
    - protocol: TCP
      port: 3000 # Port the service exposes internally
      targetPort: 3000 # Port the container is listening on
      nodePort: 30504 # Port exposed on all cluster nodes
