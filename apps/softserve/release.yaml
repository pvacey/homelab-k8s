apiVersion: v1
kind: ConfigMap
metadata:
  name: soft-serve-config
  namespace: cluster-services # Or wherever you run your git server
data:
  config.yaml: |
    callbacks:
      post-receive:
        - |
          curl -X POST \
          -H "Content-Type: application/json" \
          -d "{\"repository\": {\"url\": \"http://soft-serve-service.cluster-services.svc.cluster.local:9418/$GOSH_REPO_NAME\"}}" \
          http://el-git-listener.tekton-pipelines.svc.cluster.local:8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soft-serve-pvc
  namespace: cluster-services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soft-serve
  namespace: cluster-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soft-serve
  template:
    metadata:
      labels:
        app: soft-serve
    spec:
      containers:
        - name: soft-serve
          image: charmcli/soft-serve:latest
          ports:
            - containerPort: 23231 # SSH
            - containerPort: 9418  # Git
            - containerPort: 8080  # HTTP
          env:
            - name: SOFT_SERVE_DATA_PATH
              value: "/data"
          volumeMounts:
            - name: data
              mountPath: "/data"
            - name: config
              mountPath: "/data/config.yaml"
              subPath: "config.yaml"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: soft-serve-pvc
        - name: config
          configMap:
            name: soft-serve-config
---
apiVersion: v1
kind: Service
metadata:
  name: soft-serve-service
  namespace: cluster-services
spec:
  type: NodePort
  ports:
    - name: ssh
      port: 23231
      targetPort: 23231
    - name: git
      port: 9418
      targetPort: 9418
  selector:
    app: soft-serve
