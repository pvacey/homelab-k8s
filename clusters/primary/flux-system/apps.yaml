apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 5m0s
  path: ./apps
  prune: true # This deletes resources from K8s if you delete the file from Git
  sourceRef:
    kind: GitRepository
    name: flux-system
  commonMetadata:
    labels:
      team: homelab
