apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-dev-pvc
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: paseo-dev
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: paseo-dev
  template:
    metadata:
      labels:
        app: paseo-dev
    spec:
      containers:
      - name: paseo-dev
        image: 192.168.1.196:30500/paseo-dev:placeholder # {"$imagepolicy": "flux-system:paseo-dev-policy"}
        command: ["paseo"]
        args: ["daemon", "start", "--web-ui", "--listen", "0.0.0.0:6767"]
        workingDir: /workspace
        ports:
        - containerPort: 6767
        env:
        - name: PASEO_PASSWORD
          valueFrom:
            secretKeyRef:
              name: paseo-auth
              key: password
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: paseo-dev-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: paseo-dev-service
  namespace: default
spec:
  type: ClusterIP
  selector:
    app: paseo-dev
  ports:
    - protocol: TCP
      port: 6767
      targetPort: 6767
