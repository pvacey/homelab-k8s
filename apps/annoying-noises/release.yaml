apiVersion: apps/v1
kind: Deployment
metadata:
  name: annoying-noises
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: annoying-noises
  template:
    metadata:
      labels:
        app: annoying-noises
    spec:
      securityContext:
        fsGroup: 1000 # Automatically makes volumes writable by group 1000
      initContainers:
      - name: init-settings # 
        image: busybox
        command:
        - 'sh'
        - '-c'
        - |
          if [ -d /mnt/settings.json ]; then rm -rf /mnt/settings.json; fi
          if [ ! -f /mnt/settings.json ]; then echo "{}" > /mnt/settings.json; fi

          # This is the critical line:
          # 664 allows the 'bun' group (1000) to write to the file
          chmod 664 /mnt/settings.json
          chown 1000:1000 /mnt/settings.json
        volumeMounts:
        - name: settings-volume
          mountPath: /mnt
      containers:
      - name: annoying-noises
        image: 192.168.1.196:30500/discord-dota:1772306285-27c8c0b # {"$imagepolicy": "flux-system:annoying-noises-policy"}
        env:
        - name: DISCORD_TOKEN
          valueFrom:
            secretKeyRef:
              name: annoying-noises-secret
              key: DISCORD_TOKEN
        volumeMounts:
        - name: config-volume
          mountPath: /usr/src/app/mapping.json
          subPath: mapping.json
        - name: settings-volume
          mountPath: /usr/src/app/settings.json
          subPath: settings.json
      volumes:
      - name: config-volume
        configMap:
          name: annoying-noises-config
      - name: settings-volume
        persistentVolumeClaim:
          claimName: annoying-noises-settings
---
apiVersion: v1
kind: Service
metadata:
  name: annoying-noises-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: annoying-noises
  ports:
    - protocol: TCP
      port: 3000 # Port the service exposes internally
      targetPort: 3000 # Port the container is listening on
      nodePort: 30504 # Port exposed on all cluster nodes
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: annoying-noises-config
  namespace: default
data:
  mapping.json: |
    [
      {
        "event": "player.deaths",
        "sound": "https://www.myinstants.com/media/sounds/oh-brother-this-guy-stinks.mp3",
        "condition": "===",
        "value": 10
      },
      {
        "event": "player.deaths",
        "sound": "https://www.myinstants.com/media/sounds/studio-audience-awwww-sound-fx.mp3",
        "condition": "!==",
        "value": 10
      },
      {
        "event": "player.kills",
        "sound": "https://assets.explosivejuice.com/dota/cena.mp3",
        "condition": "===",
        "value": 10
      },
      {
        "event": "player.kills",
        "sound": "https://www.myinstants.com/media/sounds/ssbhomerun.mp3",
        "condition": "!==",
        "value": 10
      }
    ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: annoying-noises-settings
  namespace: default
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
