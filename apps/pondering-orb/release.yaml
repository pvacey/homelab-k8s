apiVersion: apps/v1
kind: Deployment
metadata:
  name: orb-backend
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orb-backend
  template:
    metadata:
      labels:
        app: orb-backend
    spec:
      containers:
      - name: orb-backend
        image: zot-service.cluster-services.svc.cluster.local:5000/orb-of-pondering:latest # {"$imagepolicy": "flux-system:pondering-policy"}
        ports:
        - containerPort: 8000
        env:
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: gemini-api-key  # The name of the Secret
              key: api-key          # The key inside the Secret
---
apiVersion: v1
kind: Service
metadata:
  name: orb-backend-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: orb-backend
  ports:
    - protocol: TCP
      port: 8000        # Port the service exposes internally
      targetPort: 8000  # Port the container is listening on
      nodePort: 30501   # Port exposed on all cluster nodes
