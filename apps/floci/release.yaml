apiVersion: v1
kind: Namespace
metadata:
  name: floci
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: floci-pvc
  namespace: floci
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: floci
  namespace: floci
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: floci-lambda-pods
  namespace: floci
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: floci-lambda-pods
  namespace: floci
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: floci-lambda-pods
subjects:
  - kind: ServiceAccount
    name: floci
    namespace: floci
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: floci
  namespace: floci
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: floci
  template:
    metadata:
      labels:
        app: floci
    spec:
      # Prevents kubelet from injecting Service env vars (FLOCI_PORT=tcp://...)
      # which collide with floci's own FLOCI_PORT config property
      enableServiceLinks: false
      serviceAccountName: floci
      containers:
      - name: floci
        image: floci/floci:2.4.0
        ports:
        - containerPort: 4566
        env:
        - name: FLOCI_STORAGE_MODE
          value: persistent
        - name: FLOCI_STORAGE_PERSISTENT_PATH
          value: /app/data
        - name: FLOCI_BASE_URL
          value: http://floci.floci.svc.cluster.local:4566
        - name: FLOCI_SERVICES_LAMBDA_EXECUTOR
          value: kubernetes
        - name: FLOCI_SERVICES_LAMBDA_KUBERNETES_NAMESPACE
          value: floci
        - name: FLOCI_SERVICES_UI_ENABLED
          value: "false"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /app/data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: floci-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: floci
  namespace: floci
spec:
  type: ClusterIP
  selector:
    app: floci
  ports:
    - protocol: TCP
      port: 4566
      targetPort: 4566
---
apiVersion: v1
kind: Service
metadata:
  name: floci-nodeport
  namespace: floci
spec:
  type: NodePort
  selector:
    app: floci
  ports:
    - protocol: TCP
      port: 4566
      targetPort: 4566
      nodePort: 30505 # Endpoint at http://<NODE_IP>:30505
