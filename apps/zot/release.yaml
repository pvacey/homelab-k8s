apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: zot-pvc
  namespace: cluster-services
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Default for k3s
  resources:
    requests:
      storage: 15Gi # Adjust based on your disk space
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zot-config
  namespace: cluster-services
data:
  config.json: |
    {
      "distSpecVersion": "1.1.0",
      "storage": {
        "rootDirectory": "/var/lib/zot"
      },
      "http": {
        "address": "0.0.0.0",
        "port": "5000"
        "compat": ["docker2s2"]
      },
      "extensions": {
        "ui": {
          "enable": true
        },
        "search": {
          "enable": true
        }
      },
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zot
  namespace: cluster-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zot
  template:
    metadata:
      labels:
        app: zot
    spec:
      containers:
      - name: zot
        image: ghcr.io/project-zot/zot-linux-amd64:latest
        ports:
        - containerPort: 5000
        volumeMounts:
        - name: config-volume
          mountPath: /etc/zot
        - name: data-volume
          mountPath: /var/lib/zot
        #command: ["/usr/bin/zot", "serve", "/etc/zot/config.json"]
      volumes:
      - name: config-volume
        configMap:
          name: zot-config
      - name: data-volume
        persistentVolumeClaim:
          claimName: zot-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: zot-service
  namespace: cluster-services
spec:
  type: NodePort
  selector:
    app: zot
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500 # You can access the UI at http://<NODE_IP>:30500
